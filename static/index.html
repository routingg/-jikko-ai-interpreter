<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>직코 AI 통역사</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#28221d;background:#fffaf2}*{box-sizing:border-box}body{margin:0}.wrap{max-width:860px;padding:32px 20px;margin:auto}.eyebrow{color:#e76b12;font-weight:800;letter-spacing:.06em}h1{font-size:clamp(30px,6vw,46px);margin:8px 0 6px}h1 span{color:#f26b19}.desc{color:#786b5b}.panel{border:1px solid #ffe0b2;background:white;border-radius:22px;padding:24px;margin-top:20px;box-shadow:0 8px 24px #a6712512}.btns{display:flex;gap:10px;flex-wrap:wrap}button{cursor:pointer;border:0;border-radius:12px;background:#fff0d7;color:#5b3a1f;padding:12px 17px;font-weight:800}button.primary{background:#ff791f;color:white}button:disabled{opacity:.55;cursor:wait}label{display:block;font-weight:800;margin:12px 0 7px}textarea,select{width:100%;border:1px solid #e8d4bc;border-radius:12px;padding:12px;font:inherit}textarea{height:95px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.result{white-space:pre-wrap;padding:13px;border:1px solid #eee3d4;border-radius:12px;min-height:54px}.lcd{border:12px solid #1e9f5b;background:#94c8dc;border-radius:15px;padding:18px;max-width:350px;margin:20px auto;box-shadow:0 5px 0 #16794b}.lcd .screen{font-family:monospace;color:#183959;font-weight:bold;letter-spacing:.4px;white-space:pre;line-height:2;font-size:18px;min-height:72px}.minor{color:#796f61;font-size:13px}#status{background:#fff5e5;border-radius:12px;padding:12px;margin-top:12px;white-space:pre-wrap}.nav{display:flex;justify-content:center;align-items:center;gap:10px}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><div class="eyebrow">JIKKO × ARDUINO × AI</div><h1>내 손안의 <span>AI 통역사</span></h1><p class="desc">한국어로 말하면 영어로 번역해 LCD에 출력합니다. 음성인식이 어렵다면 텍스트로도 사용할 수 있어요.</p><section class="panel"><div class="btns"><button id="mic" class="primary">🎤 한국어로 말하기</button><button id="conn" hidden>🔌 Arduino 연결</button><button id="test">LCD 연결 테스트</button></div><label for="text">한국어 문장</label><textarea id="text" placeholder="예: 도서관은 어디인가요?"></textarea><label for="style">번역 스타일 (바이브코딩 확장 지점)</label><select id="style"><option value="standard">자연스러운 회화</option><option value="easy">쉬운 영어</option><option value="polite">공손한 영어</option></select><div class="btns" style="margin-top:15px"><button id="send" class="primary">영어로 번역하고 LCD 보내기</button><button id="demo">예시 문장 채우기</button></div><div id="status" role="status">연결 상태 확인 중...</div></section><section class="panel"><div class="grid"><div><label>한국어 원문</label><div class="result" id="kr">-</div></div><div><label>영어 번역</label><div class="result" id="en">-</div></div></div><label>LCD 화면 미리보기 (실제 출력과 별도)</label><div class="lcd"><div class="screen" id="lcd">AI TRANSLATOR<br>READY</div></div><div class="nav"><button id="prev">이전</button><span id="pageInfo">1 / 1</span><button id="next">다음</button></div><p class="minor">실제 LCD는 16문자 × 2줄이며 긴 문장은 설정된 간격으로 넘겨 표시합니다. 하드웨어 출력 성공 여부는 상태창을 확인하세요.</p></section></main><script>
const $=id=>document.getElementById(id);let pages=[["AI TRANSLATOR","READY"]],page=0,busy=false;
function draw(){let [a,b]=pages[page]||["",""];$('lcd').textContent=a.padEnd(16,' ')+'\n'+b.padEnd(16,' ');$('pageInfo').textContent=`${page+1} / ${pages.length}`}
function setStatus(s){$('status').textContent=s}
function setBusy(on){busy=on;$('send').disabled=on;$('test').disabled=on;$('mic').disabled=on}
async function api(path,body={}){const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await response.json();if(!response.ok){if(data.english)$('en').textContent=data.english;if(data.pages?.length){pages=data.pages;page=0;draw()}throw Error(data.error||'요청 실패')}return data}
/* Web Serial: in browser mode the visitor's own browser talks to their Arduino. */
let browserMode=false,sPort=null,sWriter=null,rbuf='';const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function pump(reader){const dec=new TextDecoder();try{for(;;){const{value,done}=await reader.read();if(done)break;rbuf+=dec.decode(value)}}catch(e){}}
async function readLine(ms){const end=Date.now()+ms;for(;;){const i=rbuf.indexOf('\n');if(i>=0){const l=rbuf.slice(0,i).trim();rbuf=rbuf.slice(i+1);return l}if(Date.now()>end)throw Error('Arduino 응답 시간 초과');await sleep(30)}}
async function connectArduino(){if(!('serial'in navigator))throw Error('이 브라우저는 Web Serial을 지원하지 않습니다. Chrome 또는 Edge를 사용해 주세요.');if(sPort)return;const p=await navigator.serial.requestPort();await p.open({baudRate:9600});sPort=p;sWriter=p.writable.getWriter();pump(p.readable.getReader());await sleep(2200);rbuf='';p.addEventListener('disconnect',()=>{sPort=null;sWriter=null;$('conn').textContent='🔌 Arduino 연결';setStatus('Arduino 연결이 끊어졌습니다. 다시 연결해 주세요.')});$('conn').textContent='✅ Arduino 연결됨'}
async function sendToArduino(list){if(!sPort)throw Error('먼저 "Arduino 연결" 버튼으로 포트를 선택해 주세요.');const enc=new TextEncoder();for(let n=0;n<list.length;n++){rbuf='';await sWriter.write(enc.encode(list[n][0]+'|'+list[n][1]+'\n'));const reply=await readLine(3000);if(reply!=='OK')throw Error(`LCD acknowledgment error on page ${n+1}: '${reply}'`);if(n<list.length-1)await sleep(2700)}return list.length}
$('conn').onclick=async()=>{try{await connectArduino();setStatus('Arduino 연결 완료. LCD 연결 테스트를 눌러 보세요.')}catch(e){setStatus('Arduino 연결 오류: '+e.message)}};
$('send').onclick=async()=>{if(busy)return;let text=$('text').value.trim();if(!text){setStatus('먼저 한국어 문장을 입력하세요.');return}setBusy(true);$('kr').textContent=text;setStatus('번역 및 LCD 전송 중...');try{let d=await api('/api/translate',{text,style:$('style').value});$('en').textContent=d.english;pages=d.pages;page=0;draw();if(browserMode){const n=await sendToArduino(d.pages);setStatus(`LCD 출력 확인 완료 (${n}페이지, Arduino ACK 수신)`)}else setStatus(d.hardware.simulated?'데모 모드: 번역과 LCD 화면만 시뮬레이션했습니다.':`LCD 출력 확인 완료 (${d.hardware.pages_sent}페이지, Arduino ACK 수신)`)}catch(e){setStatus('오류: '+e.message)}finally{setBusy(false)}};
$('test').onclick=async()=>{setBusy(true);try{if(browserMode){pages=[["JIKKO SHIELD","LCD IS READY"]];page=0;draw();await sendToArduino(pages);setStatus('LCD 테스트 성공: Arduino OK 응답 수신')}else{const d=await api('/api/lcd-test');pages=d.pages;page=0;draw();setStatus(d.hardware.simulated?'시뮬레이션: 실제 LCD에 전송하지 않았습니다.':'LCD 테스트 성공: Arduino OK 응답 수신')}}catch(e){setStatus('LCD 연결 오류: '+e.message)}finally{setBusy(false)}};
$('demo').onclick=()=>{$('text').value='도서관은 어디인가요?'};
$('prev').onclick=()=>{page=Math.max(0,page-1);draw()};$('next').onclick=()=>{page=Math.min(pages.length-1,page+1);draw()};
$('mic').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){setStatus('이 브라우저에서는 음성인식을 사용할 수 없어요. 텍스트를 입력해 주세요.');return}const r=new SR();r.lang='ko-KR';r.interimResults=false;r.continuous=false;$('mic').disabled=true;setStatus('마이크에 한국어로 말해 주세요...');r.onresult=e=>{$('text').value=e.results[0][0].transcript;setStatus('음성인식 완료. 번역 버튼을 눌러 주세요.')};r.onerror=e=>setStatus('음성인식 오류: '+e.error+' · 텍스트 입력을 이용해 주세요.');r.onend=()=>{$('mic').disabled=false};try{r.start()}catch(e){$('mic').disabled=false;setStatus(e.message)}};
fetch('/api/status').then(r=>r.json()).then(d=>{browserMode=!!d.browser;if(browserMode)$('conn').hidden=false;return d}).then(d=>setStatus(d.demo?'시뮬레이션 모드 · 하드웨어 미연결':d.browser?'"Arduino 연결" 버튼으로 내 Arduino 포트를 선택한 뒤 LCD 연결 테스트를 눌러 주세요 (Chrome/Edge)':`실제 연결 모드 · 포트 ${d.port} · LCD 테스트 버튼부터 눌러 주세요`)).catch(()=>setStatus('서버 상태 확인 실패'));draw();
</script></body></html>
